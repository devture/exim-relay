name: Check (pull requests and Renovate branches)
on:
  pull_request:
  push:
    # Renovate automerges on branches (no pull request), and only does so once
    # the branch has passing checks - without this, those updates would stall.
    branches: [ "renovate/**" ]
permissions:
  contents: read
jobs:
  build:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build for all platforms
        uses: docker/build-push-action@v7.4.0
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          context: .
          file: ./Dockerfile
      # Build (from cache) once more for the runner's own platform, so that the
      # image can be loaded into Docker and started.
      - name: Build for the local platform
        uses: docker/build-push-action@v7.4.0
        with:
          load: true
          tags: exim-relay:check
          context: .
          file: ./Dockerfile
      - name: Smoke-test
        run: ./bin/smoke-test.sh exim-relay:check
